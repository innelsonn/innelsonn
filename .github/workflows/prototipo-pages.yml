# Publica el prototipo en GitHub Pages al actualizar la rama principal.
# Requiere activar Pages una vez: Settings → Pages → Source: «GitHub Actions».
name: Prototipo · GitHub Pages

on:
  push:
    branches: [main]
    paths: ['prototipo/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototipo
      - id: deploy
        uses: actions/deploy-pages@v4
